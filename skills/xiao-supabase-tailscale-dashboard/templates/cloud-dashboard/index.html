<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XIAO Cloud Dashboard</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1c1e21; --muted: #6b7280;
    --border: #e3e5e8; --accent: #f59e0b;
    --ok: #10b981; --off: #d1d5db; --bad: #ef4444; --warn: #f59e0b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111315; --card: #1b1e21; --text: #e8eaed; --muted: #9aa0a6;
      --border: #2c3035; --accent: #fbbf24;
      --ok: #34d399; --off: #3c4046; --bad: #f87171; --warn: #fbbf24;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    padding: 24px 16px;
  }
  main { max-width: 560px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; }
  h1 small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 6px; }
  .conn { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); display: inline-block; }
  .conn.live i { background: var(--ok); }
  .conn.stale i { background: var(--warn); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 440px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; display: flex; flex-direction: column; gap: 14px;
  }
  .label { font-size: 13px; color: var(--muted); }
  .state { font-size: 28px; font-weight: 600; }
  .dot {
    width: 64px; height: 64px; border-radius: 50%; background: var(--off);
    transition: background .15s, box-shadow .15s; align-self: center;
  }
  .led.on .dot { background: var(--accent); box-shadow: 0 0 24px var(--accent); }
  .touch.on .dot { background: var(--ok); box-shadow: 0 0 24px var(--ok); }
  .row { display: flex; gap: 8px; }
  button {
    flex: 1; font: inherit; font-size: 15px; padding: 10px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1c1e21; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .meter { height: 6px; border-radius: 3px; background: var(--off); overflow: hidden; position: relative; }
  .meter b { position: absolute; inset: 0 auto 0 0; background: var(--ok); width: 0; transition: width .1s; }
  .meter s { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); }
  .small { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .error { color: var(--bad); }
</style>
</head>
<body>
<main>
  <header>
    <h1>XIAO ESP32-S3<small id="deviceId"></small></h1>
    <span class="conn" id="conn"><i></i><span id="connText">연결 중</span></span>
  </header>
  <div class="grid">
    <section class="card led" id="ledCard">
      <span class="label">사용자 LED (GPIO21)</span>
      <div class="dot"></div>
      <span class="state" id="ledState">-</span>
      <div class="row">
        <button id="onBtn" class="primary">켜기</button>
        <button id="offBtn">끄기</button>
      </div>
    </section>
    <section class="card touch" id="touchCard">
      <span class="label">터치 센서 (D0 / GPIO1)</span>
      <div class="dot"></div>
      <span class="state" id="touchState">-</span>
      <div class="meter"><b id="bar"></b><s id="mark"></s></div>
      <span class="small" id="touchValue">값 - / 기준 -</span>
    </section>
  </div>
  <p class="small" id="info"></p>
  <p class="small error" id="error"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = '{{SUPABASE_URL}}';
  const SUPABASE_KEY = '{{SUPABASE_KEY}}';
  const DEVICE_ID = '{{DEVICE_ID}}';
  const OFFLINE_AFTER_MS = 10000;  // device pushes a heartbeat every 3s

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = id => document.getElementById(id);
  let device = null;

  $('deviceId').textContent = DEVICE_ID;

  function render() {
    if (!device) return;
    const s = device;
    $('ledCard').classList.toggle('on', s.led);
    $('ledState').textContent = s.led ? '켜짐' : '꺼짐';
    $('touchCard').classList.toggle('on', s.touched);
    $('touchState').textContent = s.touched ? '터치됨' : '대기';
    const max = Math.max(1, s.threshold * 2);
    $('bar').style.width = Math.min(100, s.touch_value / max * 100) + '%';
    $('mark').style.left = (s.threshold / max * 100) + '%';
    $('touchValue').textContent = '값 ' + s.touch_value + ' / 기준 ' + s.threshold;
    renderConn();
  }

  function renderConn() {
    if (!device) return;
    const age = Date.now() - new Date(device.updated_at).getTime();
    const online = age < OFFLINE_AFTER_MS;
    $('conn').className = 'conn ' + (online ? 'live' : 'stale');
    $('connText').textContent = online ? '보드 온라인' : '보드 오프라인';
    const seen = new Date(device.updated_at).toLocaleTimeString('ko-KR');
    $('info').textContent = '마지막 보고 ' + seen + ' · Wi-Fi 신호 ' + device.rssi + ' dBm';
  }

  function showError(msg) {
    $('error').textContent = msg || '';
  }

  async function load() {
    const { data, error } = await db.from('xiao_devices').select('*').eq('id', DEVICE_ID).single();
    if (error) {
      showError('불러오기 실패: ' + error.message);
      $('conn').className = 'conn';
      $('connText').textContent = '서버 연결 끊김';
      return;
    }
    showError('');
    device = data;
    render();
  }

  async function setLed(on) {
    $('onBtn').disabled = $('offBtn').disabled = true;
    const { data, error } = await db.from('xiao_devices').update({ led: on }).eq('id', DEVICE_ID).select().single();
    if (error) showError('LED 변경 실패: ' + error.message);
    else { showError(''); device = data; render(); }
    $('onBtn').disabled = $('offBtn').disabled = false;
  }

  $('onBtn').onclick = () => setLed(true);
  $('offBtn').onclick = () => setLed(false);

  // Live updates from the device via Supabase Realtime
  db.channel('xiao-' + DEVICE_ID)
    .on('postgres_changes',
        { event: 'UPDATE', schema: 'public', table: 'xiao_devices', filter: 'id=eq.' + DEVICE_ID },
        payload => { device = payload.new; render(); })
    .subscribe();

  load();
  setInterval(load, 5000);        // fallback refresh if realtime drops
  setInterval(renderConn, 1000);  // keep online/offline indicator current
</script>
</body>
</html>
